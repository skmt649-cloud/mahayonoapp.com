<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Maha Yono App</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fafafa;
      color: #1e1e24;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .error-card {
      background: #ffffff;
      border: 1px solid #f1e4e6;
      border-radius: 16px;
      padding: 50px 30px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .error-code {
      font-size: 5.5rem;
      font-weight: 900;
      line-height: 1;
      color: #d90429;
      margin-bottom: 15px;
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #11141a;
    }

    .error-desc {
      color: #6c757d;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-home {
      display: inline-block;
      background: #d90429;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
      box-shadow: 0 4px 12px rgba(217, 4, 41, 0.25);
    }

    .btn-home:hover {
      background: #b80320;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      Aap jo page dhoondh rahe hain wo remove ho chuka hai ya URL galat hai. Maha Yono App ke available games homepage par mil sakte hain.
    </p>

    <a href="/" class="btn-home">Back to Homepage</a>
  </div>

</body>
</html>
